name: ci
on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  bateria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Gate bloqueante: bateria adversarial + casos benignos + canario.
      - run: python -m pytest tests/ -q
      # Verificacao dupla: contencao abaixo do limiar reprova o pipeline.
      - run: python scripts/indicadores.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: indicadores
          path: reports/indicadores.json
